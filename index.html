---
layout: default
---

<div class="home">
  <h1>Otto Nomous</h1>
  <p>{{ site.description }}</p>
  <hr>
  <ul class="post-list">
    {% for post in site.posts %}
      <li>
        <span class="post-meta">{{ post.date | date: "%b %-d, %Y" }}</span>
        <h2>
          <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
        </h2>
        <p>{{ post.excerpt | strip_html | truncate: 200 }}</p>
      </li>
    {% endfor %}
  </ul>
</div>
